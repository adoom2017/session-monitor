# iOS app for SessionMonitor's phone access (DEV_SPEC §17). Generate the Xcode project with:
#   cd ios && xcodegen generate
# The generated SessionMonitorMobile.xcodeproj is not committed.
name: SessionMonitorMobile
options:
  bundleIdPrefix: local.sessionmonitor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SessionMonitor:
    path: ..
targets:
  SessionMonitorMobile:
    type: application
    platform: iOS
    sources:
      - SessionMonitorMobile
    dependencies:
      - package: SessionMonitor
        product: SMProtocol
    info:
      path: SessionMonitorMobile/Info.plist
      properties:
        CFBundleDisplayName: SessionMonitor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad multitasking requires every orientation.
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: 连接同一局域网或 Tailscale 中的 Mac，查看会话状态并发送消息。
        NSBonjourServices: [_sessionmonitor._tcp]
        NSCameraUsageDescription: 扫描 Mac 上 SessionMonitor 显示的配对二维码。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: local.sessionmonitor.mobile
            CFBundleURLSchemes: [sessionmonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sessionmonitor.mobile
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  SessionMonitorMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SessionMonitorMobileUITests
    dependencies:
      - target: SessionMonitorMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sessionmonitor.mobile.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SessionMonitorMobile:
    build:
      targets:
        SessionMonitorMobile: all
        SessionMonitorMobileUITests: [test]
    test:
      targets:
        - SessionMonitorMobileUITests
