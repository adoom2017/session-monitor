# iOS app (码哨 / Codewhistle) for SessionMonitor's phone access (DEV_SPEC §17). Generate the Xcode project with:
#   cd ios && xcodegen generate
# The generated project is committed (Xcode Cloud builds it as is): regenerate and commit it after
# editing this file.
name: SessionMonitorMobile
settings:
  base:
    DEVELOPMENT_TEAM: YH6JCRN97J
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
options:
  bundleIdPrefix: adoom.sessionmonitor
  developmentLanguage: en
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SessionMonitor:
    path: ..
targets:
  SessionMonitorMobile:
    type: application
    platform: iOS
    sources:
      - SessionMonitorMobile
    dependencies:
      - package: SessionMonitor
        product: SMProtocol
    info:
      path: SessionMonitorMobile/Info.plist
      properties:
        # Localized in en.lproj / zh-Hans.lproj InfoPlist.strings: 码哨 in Chinese, Codewhistle otherwise.
        CFBundleDisplayName: Codewhistle
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad multitasking requires every orientation.
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Connects to your Mac on the same network or Tailscale to show sessions and send messages.
        NSBonjourServices: [_sessionmonitor._tcp]
        NSCameraUsageDescription: Scans the pairing QR code shown by Codewhistle on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only the system's TLS (URLSession) and SHA-256 for certificate pinning: exempt
        # encryption, so App Store Connect does not ask the export question on each upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: local.sessionmonitor.mobile
            CFBundleURLSchemes: [sessionmonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: adoom.sessionmonitor.mobile
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  SessionMonitorMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SessionMonitorMobileUITests
    dependencies:
      - target: SessionMonitorMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: adoom.sessionmonitor.mobile.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SessionMonitorMobile:
    build:
      targets:
        SessionMonitorMobile: all
        SessionMonitorMobileUITests: [test]
    test:
      targets:
        - SessionMonitorMobileUITests
